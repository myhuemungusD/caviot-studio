name: Unit tests

on:
  pull_request:
    paths:
      - 'dist/**'
      - '*.mjs'
      - '*.js'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'mobile/native/**'
      - '.github/workflows/unit-tests.yml'
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '*.mjs'
      - '*.js'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'mobile/native/**'
      - '.github/workflows/unit-tests.yml'
  workflow_dispatch:

concurrency:
  group: unit-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled; main runs (TestFlight, release AAB) always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    name: Root node unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Every tests.mjs / *-tests.mjs at the repo root; any failure fails the job.
      - name: Run unit tests
        run: |
          fail=0
          for f in tests.mjs *-tests.mjs; do
            echo "::group::$f"
            if node "$f"; then echo "PASS $f"; else echo "::error::FAIL $f"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail

  native-start:
    name: Phone app start screen (e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Serve dist
        run: |
          node serve.mjs 4173 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - run: node e2e/empty-start-e2e.mjs http://127.0.0.1:4173/
      - run: node e2e/native-labels-e2e.mjs http://127.0.0.1:4173/
      - run: node e2e/invert-relief-e2e.mjs http://127.0.0.1:4173/
