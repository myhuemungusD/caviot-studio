name: macOS desktop

# Runs only when the desktop wrapper or the studio it bundles changed.
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'desktop/**'
      - '!desktop/**/*.md'
      - '.github/workflows/macos-desktop.yml'
  pull_request:
    paths:
      - 'dist/**'
      - 'desktop/**'
      - '!desktop/**/*.md'
      - '.github/workflows/macos-desktop.yml'
  workflow_dispatch:

concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled; main runs (TestFlight, release AAB) always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Smoke test
        working-directory: desktop
        run: npm test

      - name: Build unsigned or signed DMG
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK}" ]; then
            echo "No CSC_LINK secret. Building an unsigned disk image."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD
          else
            echo "CSC_LINK is set. The disk image will be signed."
          fi
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "Apple notarization secrets are not all set. Skipping notarization."
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          else
            echo "Apple notarization secrets are set. The signed app will be notarized."
          fi
          npm run dist

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: Caviot-Studio-macOS
          path: desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 14
